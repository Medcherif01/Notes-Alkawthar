<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Al Kawthar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <a href="/home.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Retour
        </a>

        <img src="https://cdn.glitch.global/f566aaa0-dea8-4ebc-bb3a-23070b8c7e7a/al-kawthar-international-schools-jeddah-saudi-arabia-modified.png?v=1739958835552"
             alt="Logo Al Kawthar">

        <div class="section-badge" id="sectionBadge">
            <i class="fas fa-graduation-cap"></i>
            <span id="sectionName">Section</span>
        </div>

        <h2>Connexion Enseignant</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">
                    <i class="fas fa-user"></i> Nom d'utilisateur
                </label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" placeholder="Entrez votre identifiant">
            </div>

            <div class="input-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Mot de passe
                </label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="Entrez votre mot de passe">
                <i class="fas fa-eye password-toggle-icon" id="togglePassword"></i>
            </div>

            <div class="options">
                <label class="checkbox-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe" name="rememberMe" value="true" checked>
                    <span>Rester connecté (session permanente)</span>
                </label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Se Connecter</span>
            </button>

            <p id="errorMessage" class="error-message"></p>
        </form>
    </div>

    <script>
        // ---- Section ----
        const urlParams = new URLSearchParams(window.location.search);
        const section   = urlParams.get('section') || 'boys';

        if (section === 'girls') {
            document.body.classList.add('girls-section');
            document.getElementById('sectionName').textContent = 'Section Filles';
        } else {
            document.body.classList.add('boys-section');
            document.getElementById('sectionName').textContent = 'Section Garçons';
        }

        // ---- Toggle password ----
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwd  = document.getElementById('password');
            const show = pwd.type === 'password';
            pwd.type   = show ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash', show);
            this.classList.toggle('fa-eye', !show);
        });

        // ---- Formulaire login ----
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const errEl    = document.getElementById('errorMessage');

            // État chargement
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Connexion...</span>';
            errEl.classList.remove('show');

            try {
                const response = await fetch('/login', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ username, password, section })
                });

                if (response.ok) {
                    btn.innerHTML = '<i class="fas fa-check"></i> <span>Connecté !</span>';
                    btn.style.background = 'linear-gradient(135deg,#2E7D32,#43A047)';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                } else {
                    errEl.textContent = '⚠ Identifiant ou mot de passe incorrect.';
                    errEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Se Connecter</span>';
                }
            } catch {
                errEl.textContent = '⚠ Erreur de connexion. Vérifiez votre connexion internet.';
                errEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Se Connecter</span>';
            }
        });
    </script>
</body>
</html>
