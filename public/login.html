<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Portail — Al Kawthar International School</title>
    <meta name="description" content="Connexion Portail — Al Kawthar International School">
    <meta property="og:title" content="Connexion Portail — Al Kawthar International School">
    <meta property="og:description" content="Connexion Portail — Al Kawthar International School">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

    <div class="login-container" style="max-width: 440px; padding: 2.2rem;">
        <a href="/home.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Accueil / Home
        </a>

        <img src="/assets/aistudio/Logo_ecole_86b17a54.png"
             alt="Logo Al Kawthar International School"
             style="width: 110px; height: 110px; object-fit: contain; margin: 0.5rem auto 1rem auto; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));">

        <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.2rem;">
            Connexion Portail
        </h2>
        <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 1.5rem;">
            Al Kawthar International School
        </p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">
                    <i class="fas fa-user"></i> Identifiant / Username
                </label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" placeholder="Entrez votre identifiant">
            </div>

            <div class="input-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Mot de passe / Password
                </label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="Entrez votre mot de passe">
                <i class="fas fa-eye password-toggle-icon" id="togglePassword"></i>
            </div>

            <div class="options">
                <label class="checkbox-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe" name="rememberMe" value="true" checked>
                    <span>Rester connecté (session permanente)</span>
                </label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn" style="padding: 0.85rem; font-size: 0.95rem; border-radius: 10px;">
                <i class="fas fa-sign-in-alt"></i>
                <span>Se Connecter / Log In</span>
            </button>

            <p id="errorMessage" class="error-message"></p>
        </form>
    </div>

    <script>
        // ---- Toggle password ----
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwd  = document.getElementById('password');
            const show = pwd.type === 'password';
            pwd.type   = show ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash', show);
            this.classList.toggle('fa-eye', !show);
        });

        // ---- Formulaire login ----
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('submitBtn');
            const errEl    = document.getElementById('errorMessage');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Connexion...</span>';
            errEl.classList.remove('show');

            try {
                const response = await fetch('/login', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ username, password, section: 'boys' })
                });

                if (response.ok) {
                    try {
                        localStorage.setItem('al_kawthar_user', username);
                        localStorage.setItem('al_kawthar_section', 'boys');
                    } catch (storageErr) {}
                    btn.innerHTML = '<i class="fas fa-check"></i> <span>Connecté !</span>';
                    btn.style.background = 'linear-gradient(135deg,#2E7D32,#43A047)';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 400);
                } else {
                    errEl.textContent = '⚠ Identifiant ou mot de passe incorrect.';
                    errEl.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Se Connecter / Log In</span>';
                }
            } catch {
                errEl.textContent = '⚠ Erreur de connexion. Vérifiez votre réseau.';
                errEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Se Connecter / Log In</span>';
            }
        });
    </script>
</body>
</html>
