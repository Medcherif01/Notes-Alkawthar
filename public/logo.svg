<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Circle with Crest Gradient -->
  <circle cx="60" cy="60" r="56" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inner Ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(253, 224, 71, 0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Academic Cap / Mortarboard -->
  <path d="M 60 30 L 92 42 L 60 54 L 28 42 Z" fill="url(#goldGrad)" />
  <path d="M 60 54 L 84 45 L 84 58 C 84 66 74 72 60 72 C 46 72 36 66 36 58 L 36 45 Z" fill="#F8FAFC" opacity="0.95"/>
  <path d="M 92 43 L 95 62 L 91 62 L 88 44 Z" fill="url(#goldGrad)"/>
  <circle cx="93" cy="64" r="2.5" fill="url(#goldGrad)"/>

  <!-- Open Book -->
  <path d="M 60 76 C 52 72 40 72 32 75 L 32 94 C 40 91 52 91 60 95 C 68 91 80 91 88 94 L 88 75 C 80 72 68 72 60 76 Z" fill="#FFFFFF"/>
  <path d="M 60 77 L 60 94" stroke="#1E3A8A" stroke-width="1.8"/>

  <!-- Stars -->
  <polygon points="60,20 62,25 67,25 63,28 65,33 60,30 55,33 57,28 53,25 58,25" fill="url(#goldGrad)"/>
  <polygon points="40,24 41,27 44,27 42,29 43,32 40,30 37,32 38,29 36,27 39,27" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="80,24 81,27 84,27 82,29 83,32 80,30 77,32 78,29 76,27 79,27" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Ribbons / Laurel Accents -->
  <path d="M 22 62 C 20 72 26 84 34 90" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 98 62 C 100 72 94 84 86 90" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
